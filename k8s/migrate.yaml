apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: blog
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: result-backend-image:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: backend-secret
          workingDir: /app
          command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
      restartPolicy: Never
  backoffLimit: 1
